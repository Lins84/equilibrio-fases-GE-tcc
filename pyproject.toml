authors = ["Your Name <you@example.com>"]
requires-python = ">=3.11"
dependencies = [
    # ATENÇÃO ao atualizar "flet": "flet-charts" é pacote separado e
    # historicamente exige a MESMA versão exata do "flet" (ex.:
