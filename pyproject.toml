    # iguais antes de commitar. Detalhe em CLAUDE.md, "Nota técnica:
    # compatibilidade com Flet 1.0.0".
    "flet>=0.86.2",
    "flet-charts>=0.86.2",
    "numpy>=2.3.2",
    "thermo>=0.4.2",
]
